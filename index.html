<style>
/* Layout: one study column; sticky day bar on top, tabs below, task cards as a timetable. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#16202c; --muted:#5a6676; --line:#dce2e9;
  --accent:#c22a3d; --accent-ink:#ffffff; --accent-soft:#fbe9eb;
  --ok:#2c7d55; --ok-soft:#e3f2ea; --warn:#a86a00;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141a; --surface:#18202a; --ink:#e6ebf1; --muted:#98a4b3; --line:#2a3542;
  --accent:#ff6b7c; --accent-ink:#1a0d10; --accent-soft:#3a1d23; --ok:#5cc48a; --ok-soft:#173326; --warn:#e7a93a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141a; --surface:#18202a; --ink:#e6ebf1; --muted:#98a4b3; --line:#2a3542;
  --accent:#ff6b7c; --accent-ink:#1a0d10; --accent-soft:#3a1d23; --ok:#5cc48a; --ok-soft:#173326; --warn:#e7a93a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:12px 4px;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.01em;margin:0}
.brand h1 span{color:var(--accent)}
.brand .meta{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-block:6px 0;scrollbar-width:none}
nav.tabs button{flex:none;border:0;background:none;color:var(--muted);font:600 14px var(--f-body);padding:8px 10px;border-bottom:3px solid transparent;cursor:pointer}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
main{padding-block:20px 60px}
h2{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.2;margin:0 0 4px;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:700;font-size:17px;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 16px}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
button,.btn{font:600 14px var(--f-body);border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
button.primary,.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
input,textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{min-height:180px;resize:vertical}
.daybar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.daybar .nav{display:flex;gap:6px}
.pill{display:inline-block;font:500 12px var(--f-mono);padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.tasks{display:grid;gap:10px}
.task{display:grid;grid-template-columns:auto 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.task.done{border-color:var(--ok)}
.task.done h3{text-decoration:line-through;text-decoration-color:var(--ok)}
.task input[type=checkbox]{width:22px;height:22px;margin-top:2px;accent-color:var(--ok)}
.task .body{min-width:0}
.task .head{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.task .time{font:500 12.5px var(--f-mono);color:var(--muted)}
.task p{margin:6px 0 0}
.task .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.quote{border-left:3px solid var(--accent);padding:6px 12px;margin:8px 0 0;background:var(--bg);border-radius:0 8px 8px 0}
.progress{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:6px 0 18px}
.progress i{display:block;height:100%;background:var(--ok)}
.weeks{display:grid;gap:10px}
.week{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.week .wh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.week .wh small{color:var(--muted)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{border:1px solid var(--line);border-radius:8px;padding:6px 4px;text-align:center;font:500 12px var(--f-mono);background:var(--bg);cursor:pointer;color:var(--ink);display:block}
.day b{display:block;font-family:var(--f-body);font-size:11px;color:var(--muted);font-weight:500}
.day.full{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.day.part{border-color:var(--warn)}
.day.today{outline:2px solid var(--accent);outline-offset:1px}
.card-box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;text-align:center;min-height:220px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.card-box .front{font-size:19px;font-weight:600}
.card-box .ex{color:var(--muted);font-style:italic}
.card-box .back{font-family:var(--f-display);font-size:24px;font-weight:700;color:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font:700 26px var(--f-display);font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:13px}
details.unit{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
details.unit summary{cursor:pointer;font-weight:600;display:flex;gap:10px;align-items:baseline}
details.unit summary .n{font:500 12px var(--f-mono);color:var(--muted);flex:none}
.ex-list{display:grid;gap:12px;margin-top:12px}
.exq{display:grid;gap:6px}
.exq .r{display:flex;gap:6px}
.exq .r input{flex:1;min-width:0}
.fb{font-size:13.5px}
.fb.good{color:var(--ok)} .fb.bad{color:var(--accent)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:500 12px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
td .ex{color:var(--muted);font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.panel + .panel{margin-top:10px}
.muted{color:var(--muted)}
.wc{font:500 12.5px var(--f-mono);color:var(--muted)}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.formrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;align-items:end}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:14px;z-index:20}
ul.clean{padding-left:18px;margin:8px 0}
@media (max-width:520px){.days{gap:4px}.day{padding:5px 2px;font-size:11px}h2{font-size:21px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
const GRAMMAR = [
{t:"Inversione dopo espressioni negative",
 e:["Dopo espressioni negative o restrittive a inizio frase (<i>Never, Rarely, Seldom, Hardly… when, No sooner… than, Not only, Under no circumstances, Little, Only when/after</i>) soggetto e ausiliare si invertono, come in una domanda.","Se non c'è un ausiliare si usa <i>do/does/did</i>: <i>Rarely does he complain.</i>","È un registro formale o enfatico, molto apprezzato nel Writing del C1."],
 x:["Never have I seen such a beautiful sunset.","No sooner had we arrived than it started to rain.","Not only did she win, but she also broke the record.","Under no circumstances should you open this door."],
 q:[["I have never been so embarrassed. → Never …","Never have I been so embarrassed."],["She rarely eats meat. → Rarely …","Rarely does she eat meat."],["We had just sat down when the phone rang. → Hardly …","Hardly had we sat down when the phone rang."],["He not only lied, he also stole money. → Not only …","Not only did he lie, but he also stole money.|Not only did he lie but he also stole money.|Not only did he lie, he also stole money."],["You mustn't leave the building in any situation. → Under no circumstances …","Under no circumstances must you leave the building.|Under no circumstances should you leave the building."],["I understood the problem only when I read the report. → Only when …","Only when I read the report did I understand the problem."]]},
{t:"Frasi scisse (cleft sentences)",
 e:["Spostano l'enfasi su un elemento: <i>It is/was + elemento + that/who…</i>","Con <i>What</i>: <i>What + frase + is/was + elemento</i> (<i>What I need is a holiday</i>).","Varianti utili: <i>All I want is…, The thing that…, The reason why… is that…, It wasn't until… that…</i>"],
 x:["It was Maria who solved the problem.","What annoys me is his attitude.","All we need is a little more time.","It wasn't until 2010 that the law was changed."],
 q:[["Tom broke the window. (enfasi su Tom) → It was …","It was Tom who broke the window.|It was Tom that broke the window."],["I need some sleep. → What …","What I need is some sleep."],["His arrogance irritates me. → What …","What irritates me is his arrogance."],["I only want to be left alone. → All …","All I want is to be left alone."],["We only realised the mistake in May. → It wasn't until …","It wasn't until May that we realised the mistake.|It wasn't until May that we realized the mistake."],["She left because she was bored. → The reason …","The reason she left was that she was bored.|The reason why she left was that she was bored.|The reason she left was because she was bored."]]},
{t:"Condizionali misti e alternative a if",
 e:["Passato → presente: <i>If + past perfect, would + infinito</i> (<i>If I had studied medicine, I would be a doctor now</i>).","Presente → passato: <i>If + past simple, would have + participio</i> (<i>If I weren't so shy, I would have spoken to her</i>).","Alternative a <i>if</i>: <i>unless, provided (that), as long as, on condition that, supposing, otherwise, but for</i>.","Inversione formale: <i>Had I known…, Were it not for…, Should you need…</i>"],
 x:["If I had taken that job, I would be living in London now.","Provided that you finish on time, you'll get a bonus.","Had I known, I would have called.","Should you have any questions, please contact us."],
 q:[["I didn't take the job, so I'm not rich now. → If I had …","If I had taken the job, I would be rich now.|If I had taken the job, I'd be rich now."],["If you need help, call me. → Should …","Should you need help, call me."],["If I had known, I would have come. → Had …","Had I known, I would have come."],["Without your help, I would have failed. → But for …","But for your help, I would have failed."],["You can borrow my car if you return it by six. → … provided …","You can borrow my car provided you return it by six.|You can borrow my car provided that you return it by six."],["If it weren't for the rain, we would go out. → Were it …","Were it not for the rain, we would go out."]]},
{t:"Modali al passato: deduzione e critica",
 e:["Deduzione sul passato: <i>must have</i> (sono sicuro di sì), <i>can't/couldn't have</i> (sono sicuro di no), <i>may/might/could have</i> (forse).","Critica o rimpianto: <i>should have / ought to have</i> (avresti dovuto), <i>shouldn't have</i>.","<i>needn't have done</i> = l'hai fatto ma non serviva; <i>didn't need to</i> = non serviva (e di solito non l'hai fatto).","<i>could have</i> = possibilità non realizzata: <i>You could have told me!</i>"],
 x:["The lights are off. They must have gone out.","He can't have finished already.","You should have seen her face!","I needn't have worried."],
 q:[["I'm sure she forgot the meeting. → She must …","She must have forgotten the meeting."],["It's impossible that he saw us. → He can't …","He can't have seen us.|He couldn't have seen us."],["Perhaps they missed the train. → They might …","They might have missed the train.|They may have missed the train."],["It was a mistake to sell the house. → We shouldn't …","We shouldn't have sold the house."],["I bought milk, but there was plenty in the fridge. → I needn't …","I needn't have bought milk."],["Why didn't you tell me? (critica) → You could …","You could have told me."]]},
{t:"Passivo avanzato e reporting passive",
 e:["<i>It is said/believed/thought that…</i> oppure <i>Soggetto + is said/believed + to + infinito</i>.","Per il passato si usa l'infinito perfetto: <i>He is thought to have left.</i>","Passivo con verbi a doppio oggetto: <i>I was given a prize.</i>","Causativo <i>have/get something done</i> e passivo con <i>get</i> (<i>get fired, get promoted</i>)."],
 x:["The painting is believed to be a fake.","It is estimated that 3 million people attended.","She is said to have earned a fortune.","We're having the kitchen redone."],
 q:[["People say that he is a genius. → He is said …","He is said to be a genius."],["People believe that the thief escaped abroad. → The thief is believed …","The thief is believed to have escaped abroad."],["Experts think the economy is recovering. → It is thought …","It is thought that the economy is recovering."],["They gave her a promotion. → She …","She was given a promotion."],["A mechanic is repairing my car. → I am having …","I am having my car repaired.|I'm having my car repaired."],["They report that ten people were injured. → Ten people are reported …","Ten people are reported to have been injured."]]},
{t:"Participle clauses",
 e:["Participio presente (-ing) per azioni contemporanee o per la causa: <i>Feeling tired, I went to bed.</i>","<i>Having + participio</i> per un'azione precedente: <i>Having finished the report, she left.</i>","Participio passato con valore passivo: <i>Built in 1890, the bridge is still used.</i>","Il soggetto sottinteso deve essere lo stesso della frase principale."],
 x:["Not knowing what to say, he left the room.","Having lived in Rome, she speaks Italian well.","Written in 1949, the novel still feels modern.","Anyone wishing to leave early should tell the teacher."],
 q:[["Because I didn't know the way, I asked a policeman. → Not knowing …","Not knowing the way, I asked a policeman."],["After she had finished the exam, she went home. → Having …","Having finished the exam, she went home."],["The house was built in 1900 and it needs repairs. → Built …","Built in 1900, the house needs repairs."],["As he was exhausted, he fell asleep. → Being …","Being exhausted, he fell asleep."],["The man who is sitting by the window is my boss. → The man sitting …","The man sitting by the window is my boss."],["Since we had spent all our money, we went home. → Having …","Having spent all our money, we went home."]]},
{t:"Wish, if only, I'd rather, it's time",
 e:["<i>wish / if only + past simple</i>: desiderio sul presente (<i>I wish I knew</i>).","<i>wish / if only + past perfect</i>: rimpianto sul passato (<i>If only I had listened</i>).","<i>wish + would</i>: fastidio per il comportamento altrui (<i>I wish you would stop</i>).","<i>I'd rather + soggetto + past simple</i>; <i>It's (high) time + soggetto + past simple</i>; <i>as if / as though</i>."],
 x:["I wish I had more free time.","If only I hadn't said that.","I'd rather you came tomorrow.","It's high time we left."],
 q:[["I'm sorry I don't speak Chinese. → I wish …","I wish I spoke Chinese.|I wish I could speak Chinese."],["I regret not listening to you. → If only …","If only I had listened to you."],["Please stop interrupting me. → I wish you …","I wish you would stop interrupting me.|I wish you'd stop interrupting me."],["I'd prefer you not to smoke here. → I'd rather …","I'd rather you didn't smoke here.|I would rather you didn't smoke here."],["You should go to bed now. → It's time …","It's time you went to bed.|It is time you went to bed."],["He talks like he knows everything. → He talks as if …","He talks as if he knew everything.|He talks as if he knows everything."]]},
{t:"Connettivi formali",
 e:["Concessione: <i>although / even though</i> + frase; <i>despite / in spite of</i> + nome o -ing; <i>despite the fact that</i>.","Contrasto: <i>whereas, while, on the other hand, nonetheless, nevertheless</i>.","Causa ed effetto: <i>owing to, due to, as a result, consequently, hence, thereby</i>.","Aggiunta: <i>moreover, furthermore, in addition to, not to mention</i>."],
 x:["Despite the high cost, the project was approved.","Owing to the strike, all flights were cancelled.","The plan is ambitious. Nevertheless, it is achievable.","Rich though he is, he lives simply."],
 q:[["Although it rained, we went out. → Despite …","Despite the rain, we went out.|Despite the fact that it rained, we went out.|Despite it raining, we went out."],["The flight was cancelled because of fog. → Owing to …","Owing to the fog, the flight was cancelled.|Owing to fog, the flight was cancelled."],["He's rich. However, he's unhappy. → Rich though …","Rich though he is, he's unhappy.|Rich though he is, he is unhappy."],["She was tired but she kept working. → In spite of …","In spite of being tired, she kept working.|In spite of her tiredness, she kept working."],["I like tea, but my sister prefers coffee. → … whereas …","I like tea, whereas my sister prefers coffee."],["The price rose, so demand fell. → … As a result, …","The price rose. As a result, demand fell.|The price rose; as a result, demand fell."]]},
{t:"Tempi narrativi e futuro nel passato",
 e:["Past perfect continuous per la durata prima di un momento passato: <i>She had been waiting for hours.</i>","Futuro nel passato: <i>was going to, was about to, was on the point of, was to</i> (destino: <i>He was to become president</i>).","<i>would</i> per abitudini passate (non con verbi di stato): <i>Every summer we would go to the sea.</i>","<i>used to</i> (abitudine passata) vs <i>be/get used to + -ing</i> (essere/abituarsi)."],
 x:["They had been arguing for hours when I arrived.","I was about to call you.","Little did they know that they were never to meet again.","I'm finally getting used to the cold."],
 q:[["She waited for two hours. Then he arrived. → She had been …","She had been waiting for two hours when he arrived.|She had been waiting for two hours before he arrived."],["I intended to call you but I forgot. → I was going …","I was going to call you but I forgot.|I was going to call you, but I forgot."],["We were just going to leave when it started snowing. → We were about …","We were about to leave when it started snowing."],["He later became prime minister (destino). → He was …","He was to become prime minister."],["Living in London is no longer strange for me. → I am used …","I am used to living in London.|I'm used to living in London."],["When we were kids, we often played in the park. → … would …","We would often play in the park when we were kids.|When we were kids, we would often play in the park."]]},
{t:"Forme di futuro avanzate",
 e:["Future continuous per azioni in corso in un momento futuro: <i>This time tomorrow I'll be flying.</i>","Future perfect per azioni completate entro un momento: <i>By 2030 we will have finished.</i>","<i>be due to</i> (programmato), <i>be bound to</i> (sicuro), <i>be on the verge/brink of</i> (sta per), <i>be set to</i> (stile giornalistico).","Dopo <i>when, as soon as, until, by the time</i> si usa il presente anche per il futuro."],
 x:["By the time you get this letter, I'll have left.","Prices are set to rise next year.","The species is on the brink of extinction.","Don't call at eight; we'll be having dinner."],
 q:[["The train is scheduled to arrive at 9. → The train is due …","The train is due to arrive at 9.|The train is due at 9."],["I'm sure it will rain. → It is bound …","It is bound to rain.|It's bound to rain."],["I will finish the report before Friday. → By Friday I will …","By Friday I will have finished the report.|By Friday I'll have finished the report."],["At 10 tomorrow I'll be in the middle of my exam. → At 10 tomorrow I'll be …","At 10 tomorrow I'll be taking my exam.|At 10 tomorrow I'll be doing my exam."],["The company is very close to collapse. → The company is on the verge …","The company is on the verge of collapse.|The company is on the verge of collapsing."],["I'll arrive and then I'll call you. → I'll call you as soon as …","I'll call you as soon as I arrive."]]},
{t:"Relative avanzate",
 e:["Preposizione + <i>whom/which</i> nel registro formale: <i>the person to whom I spoke</i>.","Quantificatori + <i>of whom/which</i>: <i>many of whom, both of which, none of which</i>.","<i>whereby</i> (per mezzo del quale), <i>in which case, at which point, by which time</i>.","Le relative non restrittive (tra virgole) non usano <i>that</i>; <i>which</i> può riferirsi a tutta la frase: <i>He was late, which annoyed me.</i>"],
 x:["The committee, most of whose members were absent, postponed the vote.","She lost her keys, which meant she couldn't get in.","We reached the top, at which point it began to snow.","The scheme whereby employees buy shares has been a success."],
 q:[["I spoke to a woman. She was very helpful. → The woman to whom …","The woman to whom I spoke was very helpful."],["I have two brothers. Both of them live abroad. → I have two brothers, both …","I have two brothers, both of whom live abroad."],["He failed the test. This surprised everyone. → He failed the test, which …","He failed the test, which surprised everyone."],["They introduced a system. Under it, workers share profits. → They introduced a system whereby …","They introduced a system whereby workers share profits."],["The train may be late. If so, we'll take a taxi. → …, in which case …","The train may be late, in which case we'll take a taxi.|The train may be late, in which case we will take a taxi."],["We received ten applications. None of them was suitable. → …, none of which …","We received ten applications, none of which was suitable.|We received ten applications, none of which were suitable."]]},
{t:"Nominalizzazione e stile formale",
 e:["Lo stile formale preferisce i nomi ai verbi: <i>The government decided</i> → <i>The government's decision</i>.","Strutture utili: <i>there has been a rise in, the introduction of, a lack of, the failure to</i>.","Rende il testo più oggettivo e compatto: ideale per report, proposte e saggi.","Non esagerare: alterna nomi e verbi per restare leggibile."],
 x:["There has been a significant rise in house prices.","The closure of the factory led to widespread unemployment.","A lack of investment is the main obstacle.","The introduction of the euro changed everyday life."],
 q:[["Prices increased sharply. → There was a sharp …","There was a sharp increase in prices.|There was a sharp rise in prices."],["The company failed to respond, which caused anger. → The company's failure …","The company's failure to respond caused anger."],["They introduced the new law in 2019. → The introduction …","The introduction of the new law was in 2019.|The introduction of the new law took place in 2019."],["People don't trust politicians, and this is a problem. → The lack …","The lack of trust in politicians is a problem."],["Unemployment fell dramatically last year. → Last year saw a dramatic …","Last year saw a dramatic fall in unemployment.|Last year saw a dramatic decrease in unemployment."],["Because it rained heavily, the match was cancelled. → Due to the heavy …","Due to the heavy rain, the match was cancelled.|Due to the heavy rainfall, the match was cancelled."]]},
{t:"Enfasi e intensificatori",
 e:["<i>do/does/did</i> enfatico nelle frasi affermative: <i>I do like your idea.</i>","<i>so</i> + aggettivo/avverbio; <i>such (a)</i> + aggettivo + nome.","Intensificatori naturali: <i>utterly, deeply, highly, bitterly, by far, the very, whatsoever</i> (nelle negazioni).","Inversione con so/such: <i>So difficult was the test that…; Such was his anger that…</i>"],
 x:["I did warn you!","It was by far the best meal I've ever had.","She was bitterly disappointed.","There is no evidence whatsoever."],
 q:[["I really believe you. (enfasi con ausiliare) → I do …","I do believe you."],["The test was so difficult that nobody passed. → So difficult …","So difficult was the test that nobody passed."],["His anger was so great that he left. → Such …","Such was his anger that he left."],["She is much the best player. → She is by far …","She is by far the best player."],["I have no doubt at all. → … whatsoever.","I have no doubt whatsoever."],["It was a really boring film. → It was such …","It was such a boring film."]]},
{t:"Ellissi e sostituzione",
 e:["<i>so / not</i> sostituiscono una frase dopo <i>think, hope, expect, suppose, be afraid</i>: <i>I hope so / I'm afraid not</i>.","<i>do so</i> (formale) evita di ripetere il verbo: <i>He promised to help and did so.</i>","<i>one/ones</i> sostituiscono nomi numerabili: <i>I prefer the red one.</i>","Ellissi dopo ausiliari e <i>to</i>: <i>I'd love to. She can't swim but I can.</i>"],
 x:["Is it going to rain? I expect so.","Are you coming? I'm afraid not.","Those who wish to leave may do so now.","He said he'd call, but he didn't."],
 q:[["Will it rain? I think it will. → I think …","I think so."],["Is he coming? I hope he isn't. → I hope …","I hope not."],["He was asked to resign and he resigned. → … and he did so.","He was asked to resign and he did so."],["I don't like these shoes; I prefer the black shoes. → … the black ones.","I don't like these shoes; I prefer the black ones.|I prefer the black ones."],["Would you like to come? Yes, I'd love to come. → Yes, I'd love …","Yes, I'd love to."],["She has finished, but I haven't finished. → … but I haven't.","She has finished, but I haven't."]]},
{t:"Verb patterns e causativi",
 e:["Cambio di significato con <i>-ing</i> o <i>to</i>: <i>remember, forget, stop, try, regret, go on</i>.","<i>stop to do</i> = fermarsi per fare; <i>stop doing</i> = smettere. <i>try doing</i> = provare un metodo; <i>try to do</i> = sforzarsi.","Causativi: <i>make sb do, let sb do, have sb do, get sb to do</i>.","<i>advise, urge, encourage, forbid + oggetto + to</i>; <i>suggest, recommend + -ing</i> o <i>that</i>."],
 x:["I'll never forget meeting you.","We regret to inform you that the flight is delayed.","Try turning it off and on again.","She got her sister to drive her home."],
 q:[["I locked the door; I remember it clearly. → I remember …","I remember locking the door."],["Don't forget: you must call your mother. → Remember …","Remember to call your mother."],["He interrupted his walk because he wanted a cigarette. → He stopped …","He stopped to have a cigarette.|He stopped to smoke a cigarette."],["I persuaded my brother to help me. → I got my brother …","I got my brother to help me."],["My boss forced me to work late. → My boss made …","My boss made me work late."],["She said: 'Why don't you see a doctor?' → She suggested …","She suggested seeing a doctor.|She suggested that I see a doctor.|She suggested that I should see a doctor."]]},
{t:"Preposizioni dipendenti",
 e:["Molti aggettivi, verbi e nomi vogliono una preposizione fissa: <i>dependent on, capable of, insist on, a demand for</i>.","Impara la combinazione intera nelle flashcard, mai la parola da sola.","Errori tipici degli italiani: <i>depend from</i> (→ on), <i>married with</i> (→ to), <i>discuss about</i> (→ discuss), <i>explain me</i> (→ explain to me).","Dopo una preposizione il verbo va in -ing: <i>She insisted on paying.</i>"],

 q:[["It depends ___ the weather.","on"],["She is married ___ a doctor.","to"],["He was accused ___ stealing.","of"],["There is a growing demand ___ renewable energy.","for"],["I'm not capable ___ lying.","of"],["She succeeded ___ passing the exam.","in"]]}

const DAYS = 112;
const DOW = ["Lunedì","Martedì","Mercoledì","Giovedì","Venerdì","Sabato","Domenica"];
const LISTEN = [
  {n:"BBC Learning English: 6 Minute English", u:"https://www.bbc.co.uk/learningenglish/english/features/6-minute-english"},
  {n:"TED Talks", u:"https://www.ted.com/talks"},
  {n:"BBC Radio 4: In Our Time", u:"https://www.bbc.co.uk/programmes/b006qykl"},
  {n:"The Guardian: Today in Focus", u:"https://www.theguardian.com/news/series/todayinfocus"},
  {n:"NPR: Planet Money", u:"https://www.npr.org/sections/money/"},
  {n:"BBC World Service: The Documentary", u:"https://www.bbc.co.uk/programmes/p02nq0lx"},
  {n:"TED-Ed su YouTube", u:"https://www.youtube.com/@TEDEd"}
];
const READ = [
  {n:"The Guardian (Opinion)", u:"https://www.theguardian.com/uk/commentisfree"},
  {n:"The Conversation", u:"https://theconversation.com/global"},
  {n:"BBC Future", u:"https://www.bbc.com/future"},
  {n:"BBC News", u:"https://www.bbc.com/news"},
  {n:"Aeon (saggi)", u:"https://aeon.co"},
  {n:"NPR", u:"https://www.npr.org"}
];
const LINKS = {
  efset:"https://www.efset.org",
  cae:"https://www.cambridgeenglish.org/exams-and-tests/advanced/",
  ielts:"https://takeielts.britishcouncil.org/take-ielts/prepare/free-ielts-english-practice-tests",
  wi:"https://writeandimprove.com",
  italki:"https://www.italki.com",
  tandem:"https://www.tandem.net",
  youglish:"https://youglish.com"
};
const KEY = "percorso-c1.v1";

/* ---------- state ---------- */
let S = {start:null, done:{}, cards:{}, custom:[], drafts:{}, tests:[], errors:"", reverse:false};
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch(e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} }

/* ---------- dates ---------- */
const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const diffDays = (a,b) => Math.round((parse(iso(a)) - parse(iso(b))) / 864e5);
const today = () => parse(iso(new Date()));
function defaultStart(){ const t = today(); const wd = (t.getDay()+6)%7; return iso(wd===0 ? t : addDays(t, 7-wd)); }
function startDate(){ return parse(S.start || defaultStart()); }
function realDay(){ return diffDays(today(), startDate()) + 1; }
function curDay(){ return Math.min(DAYS, Math.max(1, realDay())); }
function curWeek(){ return Math.ceil(curDay()/7); }
function dateOf(d){ return addDays(startDate(), d-1); }
const fmt = d => d.toLocaleDateString("it-IT",{weekday:"long", day:"numeric", month:"long"});

/* ---------- helpers ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const link = (l, label) => `<a href="${l.u||l}" target="_blank" rel="noopener">${esc(label || l.n)}</a>`;
function toast(msg){ const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 1800); }
const words = s => (s.trim().match(/\S+/g) || []).length;

/* ---------- the daily programme ---------- */
function tasksFor(d){
  const w = Math.ceil(d/7), dow = (d-1)%7, th = THEMES[w-1], g = GRAMMAR[w-1];
  const L = LISTEN[(d-1) % LISTEN.length], R = READ[(d-1) % READ.length];
  const intensive = d % 2 === 1;
  const T = [];
  T.push({title:"Flashcard", time:"15 min",
    html:`<p>Ripassa le carte in scadenza oggi. Questa settimana si aggiungono le espressioni del tema <b>${esc(th.t)}</b>.</p>`,
    act:[["Apri le flashcard","flash"]]});
  T.push({title: intensive ? "Ascolto intensivo" : "Ascolto estensivo", time:"25 min",
    html: intensive
      ? `<p>Scegli 8-10 minuti da ${link(L)}. Ascolta una volta senza testo, una seconda con la trascrizione. Poi riassumi a voce in 3 frasi.</p>`
      : `<p>Ascolta un episodio intero da ${link(L)} senza fermarti. Alla fine annota 3 espressioni che vuoi ricordare.</p>`});
  T.push({title:"Lettura", time:"25 min",
    html:`<p>Leggi un articolo da ${link(R)}, se puoi sul tema <b>${esc(th.t)}</b>. Sottolinea 5-8 espressioni nuove e aggiungile alle flashcard.</p>`,
    act:[["Aggiungi carte","flash"]]});
  T.push(evening(d, w, dow, th, g));
  T.push({title:"Parlato e shadowing", time:"15 min",
    html:`<p>Registrati per 2 minuti rispondendo a questa domanda, poi riascoltati e annota un errore nel quaderno degli errori. Chiudi con 5 minuti di shadowing sull'audio di oggi.</p><div class="quote">${esc(th.s[dow%5])}</div>`});
  return T;
}
function evening(d, w, dow, th, g){
  const T = {time:"40 min"};
  if (w === 1 && dow < 3){
    const parts = [
      ["Test iniziale: grammatica e lessico", `<p>Fai il test gratuito ${link(LINKS.efset,"EF SET")} (circa 50 minuti) e annota il livello CEFR ottenuto nella scheda Progressi.</p>`],
      ["Test iniziale: lettura e ascolto", `<p>Scarica un sample test ufficiale dal sito ${link(LINKS.cae,"Cambridge C1 Advanced")} e svolgi a tempo una parte di Reading e una di Listening. Segna le percentuali nella scheda Progressi.</p>`],
      ["Test iniziale: scrittura e parlato", `<p>Scrivi il saggio della settimana nella scheda Scrittura, senza dizionario, in 45 minuti. Poi registrati per 2 minuti sulla domanda: <i>Should governments limit working hours?</i> Conserva la registrazione per confrontarla tra un mese.</p>`]
    ];
    return Object.assign(T, {title:parts[dow][0], html:parts[dow][1], act:[["Apri Progressi","progress"]].concat(dow===2?[["Apri Scrittura","write"]]:[])});
  }
  switch(dow){
    case 0: return Object.assign(T, {title:"Grammatica: "+g.t, html:`<p>Studia la spiegazione e gli esempi, poi fai gli esercizi. Scrivi 10 frasi tue con la struttura della settimana.</p>`, act:[["Apri la lezione","grammar:"+(w-1)]]});
    case 1: return Object.assign(T, {title:"Scrittura: saggio", html:`<p>Scrivi 220-260 parole in 40 minuti. Fatti correggere e riscrivi le frasi sbagliate.</p><div class="quote">${esc(th.w1)}</div>`, act:[["Scrivi nella scheda Scrittura","write:"+(w-1)+"a"]]});
    case 2: return Object.assign(T, {title:"Conversazione", html:`<p>30 minuti di conversazione con un tutor (${link(LINKS.italki,"italki")}) o in uno scambio linguistico (${link(LINKS.tandem,"Tandem")}) sul tema <b>${esc(th.t)}</b>. Usa almeno 5 espressioni della settimana. Senza partner: rispondi a voce a tutte e 5 le domande del tema.</p><ul class="clean">${th.s.map(q=>`<li>${esc(q)}</li>`).join("")}</ul>`});
    case 3: return Object.assign(T, {title:"Lessico: "+th.t, html:`<p>Studia le 15 espressioni del tema. Per ognuna scrivi una frase che parli di te. Poi ripassale con le flashcard.</p>`, act:[["Apri il lessico","vocab:"+(w-1)],["Flashcard","flash"]]});
    case 4: return Object.assign(T, {title:"Scrittura: "+th.w2[0].toLowerCase(), html:`<p>Scrivi 220-260 parole con il registro adatto al genere. Confronta poi con un modello C1 e correggi.</p><div class="quote">${esc(th.w2[1])}</div>`, act:[["Scrivi nella scheda Scrittura","write:"+(w-1)+"b"]]});
    case 5:
      if (w % 4 === 0) return Object.assign(T, {title:"Verifica mensile", time:"2 ore", html:`<p>Prova completa a tempo: Reading e Listening da un sample test ${link(LINKS.cae,"Cambridge C1 Advanced")} oppure ${link(LINKS.ielts,"IELTS")}, più un saggio e una registrazione di 2 minuti sulla stessa domanda del primo giorno. Inserisci i risultati in Progressi.</p>`, act:[["Registra i risultati","progress"]]});
      return Object.assign(T, {title: w%2 ? "Prova d'esame: Reading" : "Prova d'esame: Listening", html:`<p>Svolgi una parte di ${w%2?"Reading":"Listening"} a tempo da un test ufficiale (${link(LINKS.cae,"C1 Advanced")} o ${link(LINKS.ielts,"IELTS")}). Analizza ogni errore: perché la risposta giusta è giusta?</p>`});
    default: return Object.assign(T, {title:"Ripasso della settimana", html:`<p>Rileggi il quaderno degli errori e riscrivi corrette 5 frasi sbagliate. Rifai gli esercizi di grammatica della settimana. Poi guarda un film o due episodi di una serie in inglese, senza sottotitoli italiani.</p>`, act:[["Quaderno degli errori","progress"],["Esercizi","grammar:"+(w-1)]]});
  }
}
const isDone = (d,i) => !!S.done[d+"-"+i];
const dayCount = d => [0,1,2,3,4].filter(i => isDone(d,i)).length;

/* ---------- flashcards ---------- */
const INTERVALS = [0,1,2,4,8,16,32];
function deck(){
  const w = curWeek(), out = [];
  for (let t = 0; t < w; t++) THEMES[t].v.forEach((v,i) => out.push({id:`t${t}-${i}`, en:v[0], it:v[1], ex:v[2], src:THEMES[t].t}));
  S.custom.forEach((c,i) => out.push({id:"c"+c.id, en:c.en, it:c.it, ex:c.ex||"", src:"Le tue carte"}));
  return out;
}
function dueCards(){ const t = iso(today()); return deck().filter(c => { const s = S.cards[c.id]; return !s || s.due <= t; }); }
let fc = {queue:null, cur:null, shown:false};

/* ---------- views ---------- */
const TABS = [["today","Oggi"],["calendar","Calendario"],["flash","Flashcard"],["grammar","Grammatica"],["vocab","Lessico"],["write","Scrittura"],["progress","Progressi"],["info","Impostazioni"]];
let tab = "today", param = null, viewDay = curDay();
try { const h = location.hash.slice(1); if (TABS.some(t => t[0]===h)) tab = h; } catch(e) {}

function go(spec){ const [t,p] = spec.split(":"); tab = t; param = p ?? null; if (t==="flash") fc.queue = null; render(); window.scrollTo(0,0); }

function render(){
  document.getElementById("tabs").innerHTML = TABS.map(([k,l]) => `<button role="tab" aria-selected="${k===tab}" data-tab="${k}">${l}</button>`).join("");
  const rd = realDay();
  document.getElementById("meta").textContent = rd < 1 ? `Si parte ${fmt(startDate())}` : rd > DAYS ? "Percorso completato" : `Giorno ${curDay()} di ${DAYS} · settimana ${curWeek()}`;
  const v = document.getElementById("view");
  v.innerHTML = ({today:vToday, calendar:vCalendar, flash:vFlash, grammar:vGrammar, vocab:vVocab, write:vWrite, progress:vProgress, info:vInfo})[tab]();
  if (tab === "grammar" && param !== null){ const el = document.getElementById("u"+param); if (el){ el.open = true; el.scrollIntoView({block:"start"}); } }
}

function vToday(){
  const d = viewDay, w = Math.ceil(d/7), dow = (d-1)%7, T = tasksFor(d), done = dayCount(d);
  const rd = realDay();
  const note = rd < 1 ? `<p class="sub">Il percorso inizia ${fmt(startDate())}. Puoi cambiare la data in Impostazioni. Intanto ecco il primo giorno.</p>` : "";
  return `${note}<div class="daybar"><div><div class="eyebrow">Settimana ${w} · ${DOW[dow]} · ${esc(THEMES[w-1].t)}</div><h2>Giorno ${d} <span class="muted" style="font-weight:500;font-size:16px">${fmt(dateOf(d))}</span></h2></div>
  <div class="nav"><button data-day="${d-1}" ${d<=1?"disabled":""} aria-label="Giorno precedente">‹</button><button data-day="${curDay()}">Oggi</button><button data-day="${d+1}" ${d>=DAYS?"disabled":""} aria-label="Giorno successivo">›</button></div></div>
  <div class="muted" style="font-size:13px">${done} di 5 attività completate · circa 2 ore</div><div class="progress"><i style="width:${done*20}%"></i></div>
  <div class="tasks">${T.map((t,i) => `<div class="task ${isDone(d,i)?"done":""}"><input type="checkbox" id="t${d}-${i}" data-check="${d}-${i}" ${isDone(d,i)?"checked":""} aria-label="Fatto: ${esc(t.title)}"><div class="body"><div class="head"><h3><label for="t${d}-${i}">${esc(t.title)}</label></h3><span class="time">${t.time}</span></div>${t.html}${t.act?`<div class="actions">${t.act.map(a=>`<button data-go="${a[1]}">${a[0]}</button>`).join("")}</div>`:""}</div></div>`).join("")}</div>`;
}

function vCalendar(){
  let total = 0; for (let d=1; d<=DAYS; d++) total += dayCount(d);
  let html = `<h2>Calendario</h2><p class="sub">16 settimane, un tema e una struttura grammaticale a settimana. Tocca un giorno per aprirlo. Completamento totale: ${Math.round(total/(DAYS*5)*100)}%.</p><div class="weeks">`;
  for (let w=1; w<=16; w++){
    html += `<div class="week"><div class="wh"><h3>Settimana ${w}: ${esc(THEMES[w-1].t)}</h3><small>${esc(GRAMMAR[w-1].t)}${w%4===0?" · verifica mensile":""}</small></div><div class="days">`;
    for (let i=0; i<7; i++){
      const d = (w-1)*7+i+1, c = dayCount(d), dt = dateOf(d);
      html += `<button class="day ${c===5?"full":c>0?"part":""} ${d===curDay()&&realDay()>=1?"today":""}" data-open="${d}" aria-label="Giorno ${d}, ${c} di 5"><b>${DOW[i].slice(0,3)}</b>${dt.getDate()}/${dt.getMonth()+1}</button>`;
    }
    html += `</div></div>`;
  }
  return html + `</div>`;
}

function vFlash(){
  if (!fc.queue){ fc.queue = dueCards().sort(() => Math.random()-.5); fc.shown = false; }
  const total = deck().length, learned = deck().filter(c => (S.cards[c.id]?.b||0) >= 3).length;
  const c = fc.queue[0];
  let box;
  if (!c) box = `<div class="card-box"><h3>Nessuna carta da ripassare oggi</h3><p class="muted">Torna domani, oppure aggiungi le espressioni che trovi leggendo.</p></div>`;
  else {
    const front = S.reverse ? c.en : c.it, back = S.reverse ? c.it : c.en;
    box = `<div class="card-box"><div class="eyebrow">${esc(c.src)} · ${fc.queue.length} da ripassare</div><div class="front">${esc(front)}</div>
      ${fc.shown ? `<div class="back">${esc(back)}</div>${c.ex?`<div class="ex">${esc(c.ex)}</div>`:""}<div class="row"><button data-fc="0">Non la sapevo</button><button class="primary" data-fc="1">La sapevo</button></div>`
                 : `<div class="row"><button class="primary" data-fc="show">Mostra la risposta</button></div>`}</div>`;
  }
  return `<h2>Flashcard</h2><p class="sub">${total} carte nel mazzo, ${learned} ormai memorizzate. Le carte che sai tornano dopo 1, 2, 4, 8, 16 e 32 giorni; quelle che sbagli tornano domani.</p>
  ${box}
  <div class="row" style="margin-top:10px"><button data-rev>${S.reverse?"Mostra prima l'italiano":"Mostra prima l'inglese"}</button></div>
  <div class="panel" style="margin-top:18px"><h3>Aggiungi una carta</h3><p class="muted" style="margin:4px 0 10px">Per le espressioni che trovi in lettura e ascolto.</p>
  <div class="formrow"><label class="f">Inglese<input id="nc-en" placeholder="heavily reliant on"></label><label class="f">Italiano<input id="nc-it" placeholder="fortemente dipendente da"></label></div>
  <label class="f" style="margin-top:8px">Frase d'esempio (facoltativa)<input id="nc-ex" placeholder="The region is heavily reliant on tourism."></label>
  <div style="margin-top:10px"><button class="primary" data-addcard>Aggiungi</button></div></div>
  ${S.custom.length?`<div class="panel"><h3>Le tue carte (${S.custom.length})</h3><div class="tbl"><table><tbody>${S.custom.slice().reverse().map(c=>`<tr><td><b>${esc(c.en)}</b><div class="ex">${esc(c.ex||"")}</div></td><td>${esc(c.it)}</td><td><button data-delcard="${c.id}" aria-label="Elimina">✕</button></td></tr>`).join("")}</tbody></table></div></div>`:""}`;
}

function vGrammar(){
  return `<h2>Grammatica avanzata</h2><p class="sub">Una struttura a settimana, da studiare il lunedì e ripassare la domenica. Scrivi la risposta e premi Verifica; le soluzioni accettano le varianti più comuni.</p>` +
  GRAMMAR.map((g,u) => `<details class="unit" id="u${u}"><summary><span class="n">Sett. ${u+1}</span>${esc(g.t)}</summary>
    <ul class="clean">${g.e.map(e=>`<li>${e}</li>`).join("")}</ul>
    <div class="eyebrow" style="margin-top:10px">Esempi</div><ul class="clean">${g.x.map(x=>`<li><i>${esc(x)}</i></li>`).join("")}</ul>
    <div class="eyebrow" style="margin-top:10px">Esercizi</div><div class="ex-list">${g.q.map((q,i)=>`<div class="exq"><div>${i+1}. ${esc(q[0])}</div><div class="r"><input id="g${u}-${i}" aria-label="Risposta ${i+1}"><button data-check-ex="${u}-${i}">Verifica</button></div><div class="fb" id="fb${u}-${i}"></div></div>`).join("")}</div></details>`).join("");
}
const norm = s => s.toLowerCase().replace(/[’‘]/g,"'").replace(/[.,;:!?"]/g,"").replace(/\s+/g," ").trim();

function vVocab(){
  const u = param !== null ? +param : curWeek()-1;
  const th = THEMES[u];
  return `<h2>Lessico</h2><p class="sub">15 espressioni a settimana, già nel mazzo delle flashcard. Impara sempre la combinazione intera.</p>
  <label class="f" style="max-width:360px;margin-bottom:12px">Tema<select id="vsel">${THEMES.map((t,i)=>`<option value="${i}" ${i===u?"selected":""}>Settimana ${i+1}: ${esc(t.t)}</option>`).join("")}</select></label>
  <div class="tbl"><table><thead><tr><th>Espressione</th><th>Significato</th></tr></thead><tbody>${th.v.map(v=>`<tr><td><b>${esc(v[0])}</b><div class="ex">${esc(v[2])}</div></td><td>${esc(v[1])}</td></tr>`).join("")}</tbody></table></div>
  <p class="muted" style="font-size:13px">Per sentire la pronuncia in contesto cerca l'espressione su ${link(LINKS.youglish,"YouGlish")}.</p>`;
}

function vWrite(){
  const opts = [];
  THEMES.forEach((t,i) => { opts.push([i+"a", `Sett. ${i+1}: saggio`, "Saggio", t.w1]); opts.push([i+"b", `Sett. ${i+1}: ${t.w2[0].toLowerCase()}`, t.w2[0], t.w2[1]]); });
  const k = param || ((curWeek()-1)+"a");
  const cur = opts.find(o => o[0]===k) || opts[0];
  const txt = S.drafts[cur[0]] || "";
  return `<h2>Scrittura</h2><p class="sub">Due testi a settimana, 220-260 parole ciascuno. Le bozze si salvano da sole.</p>
  <label class="f" style="max-width:360px;margin-bottom:12px">Compito<select id="wsel">${opts.map(o=>`<option value="${o[0]}" ${o[0]===cur[0]?"selected":""}>${esc(o[1])}${S.drafts[o[0]]?" ✓":""}</option>`).join("")}</select></label>
  <div class="panel"><div class="eyebrow">${esc(cur[2])}</div><p style="margin:6px 0 0">${esc(cur[3])}</p></div>
  <div class="panel"><textarea id="draft" data-key="${cur[0]}" placeholder="Scrivi qui il tuo testo…">${esc(txt)}</textarea>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px;flex-wrap:wrap"><span class="wc" id="wc">${words(txt)} parole</span><button data-copy>Copia il testo</button></div></div>
  <div class="panel"><h3>Prima di consegnare, controlla</h3><ul class="clean">
  <li><b>Contenuto</b>: hai risposto a tutti i punti della consegna?</li><li><b>Registro</b>: formale o informale secondo il genere, senza mescolarli.</li>
  <li><b>Organizzazione</b>: paragrafi chiari e connettivi vari (<i>moreover, nevertheless, owing to…</i>).</li><li><b>Lingua</b>: almeno due strutture avanzate (inversione, frase scissa, participle clause) e 5 espressioni del lessico.</li></ul>
  <p class="muted" style="margin:0">Per la correzione: incolla il testo su ${link(LINKS.wi,"Write & Improve")} di Cambridge (gratuito), mandalo a un tutor, oppure chiedi a un'IA di valutarlo con i criteri Cambridge C1.</p></div>`;
}

function vProgress(){
  let full = 0, streak = 0; for (let d=1; d<=DAYS; d++) if (dayCount(d)===5) full++;
  for (let d = Math.min(curDay(), DAYS); d >= 1; d--){ if (dayCount(d) > 0) streak++; else if (d !== curDay()) break; }
  const learned = deck().filter(c => (S.cards[c.id]?.b||0) >= 3).length;
  const essays = Object.values(S.drafts).filter(t => words(t) >= 150).length;
  const tests = S.tests.slice().sort((a,b) => a.date < b.date ? 1 : -1);
  return `<h2>Progressi</h2><p class="sub">Obiettivo: superare stabilmente il 70-75% in Reading e Listening di livello C1 e ottenere giudizi da 4 in su in scrittura e parlato.</p>
  <div class="stats"><div class="stat"><b>${full}</b><span>giorni completati su ${DAYS}</span></div><div class="stat"><b>${streak}</b><span>giorni di fila con almeno un'attività</span></div><div class="stat"><b>${learned}</b><span>espressioni memorizzate</span></div><div class="stat"><b>${essays}</b><span>testi scritti</span></div></div>
  <div class="panel"><h3>Risultati dei test</h3><p class="muted" style="margin:4px 0 10px">Test iniziale nella settimana 1, poi una verifica ogni 4 settimane. Scrittura e parlato da 1 a 5 (5 = livello C1 pieno).</p>
  <div class="formrow"><label class="f">Data<input type="date" id="ts-date" value="${iso(today())}"></label><label class="f">Tipo<select id="ts-type"><option>Iniziale</option><option>Mensile</option><option>Simulazione d'esame</option><option>EF SET</option></select></label>
  <label class="f">Reading %<input type="number" min="0" max="100" id="ts-r"></label><label class="f">Listening %<input type="number" min="0" max="100" id="ts-l"></label>
  <label class="f">Scrittura 1-5<input type="number" min="1" max="5" id="ts-w"></label><label class="f">Parlato 1-5<input type="number" min="1" max="5" id="ts-s"></label></div>
  <label class="f" style="margin-top:8px">Note (es. livello EF SET, errori ricorrenti)<input id="ts-n"></label>
  <div style="margin-top:10px"><button class="primary" data-addtest>Salva risultato</button></div>
  ${tests.length?`<div class="tbl" style="margin-top:14px"><table><thead><tr><th>Data</th><th>Tipo</th><th>Reading</th><th>Listening</th><th>Scritt.</th><th>Parlato</th><th>Note</th><th></th></tr></thead><tbody>${tests.map(t=>`<tr><td>${esc(t.date)}</td><td>${esc(t.type)}</td><td>${t.r!==""?esc(t.r)+"%":""}</td><td>${t.l!==""?esc(t.l)+"%":""}</td><td>${esc(t.w)}</td><td>${esc(t.s)}</td><td>${esc(t.n)}</td><td><button data-deltest="${t.id}" aria-label="Elimina">✕</button></td></tr>`).join("")}</tbody></table></div>`:""}</div>
  <div class="panel"><h3>Quaderno degli errori</h3><p class="muted" style="margin:4px 0 10px">Annota ogni errore ricorrente con la versione corretta. Rileggilo ogni domenica.</p><textarea id="errors" placeholder="I depend from my parents → I depend on my parents">${esc(S.errors)}</textarea></div>`;
}

let confirmReset = false;
function vInfo(){
  return `<h2>Impostazioni</h2>
  <div class="panel"><h3>Data di inizio</h3><p class="muted" style="margin:4px 0 10px">Il giorno 1 è un lunedì consigliato. Il programma dura 16 settimane.</p>
  <div class="formrow"><label class="f">Inizio<input type="date" id="startd" value="${iso(startDate())}"></label><div><button class="primary" data-setstart>Salva</button></div></div></div>
  <div class="panel"><h3>Come funziona</h3><ul class="clean">
  <li>Ogni giorno 5 attività per circa 2 ore: flashcard, ascolto, lettura, un blocco serale che cambia col giorno della settimana e parlato.</li>
  <li>Il calendario mostra il completamento: verde = giornata completa.</li>
  <li>Flashcard, grammatica, lessico, scrittura e progressi funzionano anche offline. Ascolto, lettura e test d'esame richiedono internet perché rimandano a siti esterni.</li>
  <li>I tuoi progressi restano salvati in questo browser, su questo dispositivo. Per spostarli su un altro dispositivo usa il backup qui sotto.</li></ul></div>
  <div class="panel"><h3>Installa l'app sul telefono</h3><ul class="clean"><li><b>iPhone</b>: apri il sito in Safari, premi Condividi e poi "Aggiungi alla schermata Home".</li><li><b>Android</b>: apri il sito in Chrome, premi il menu ⋮ e poi "Installa app" (o "Aggiungi a schermata Home").</li><li>Dopo la prima apertura l'app funziona anche senza connessione. Usa sempre l'icona: su iPhone l'app installata e Safari salvano i progressi separatamente.</li></ul></div>
  <div class="panel"><h3>Backup</h3><p class="muted" style="margin:4px 0 10px">Copia il codice e conservalo (per esempio in una nota). Per ripristinare, incollalo qui e premi Ripristina.</p>
  <textarea id="bk" style="min-height:110px;font-family:var(--f-mono);font-size:12px"></textarea>
  <div class="row" style="justify-content:flex-start;margin-top:8px"><button data-export>Genera e copia il backup</button><button data-import>Ripristina dal codice</button></div></div>
  <div class="panel"><h3>Ricomincia da capo</h3><p class="muted" style="margin:4px 0 10px">Cancella tutti i progressi, le carte e le bozze su questo dispositivo.</p>
  ${confirmReset?`<div class="row" style="justify-content:flex-start"><button class="primary" data-reset="yes">Sì, cancella tutto</button><button data-reset="no">Annulla</button></div>`:`<button data-reset="ask">Cancella i progressi</button>`}</div>`;
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("button,[data-open]"); if (!b) return;
  const ds = b.dataset;
  if (ds.tab){ tab = ds.tab; param = null; if (tab==="flash") fc.queue = null; if (tab==="today") viewDay = curDay(); render(); return; }
  if (ds.go){ go(ds.go); return; }
  if (ds.day){ viewDay = Math.min(DAYS, Math.max(1, +ds.day)); render(); return; }
  if (ds.open){ viewDay = +ds.open; tab = "today"; render(); window.scrollTo(0,0); return; }
  if (ds.fc){
    if (ds.fc === "show"){ fc.shown = true; render(); return; }
    const c = fc.queue.shift(), st = S.cards[c.id] || {b:0};
    if (ds.fc === "1"){ st.b = Math.min(6, (st.b||0) + 1); st.due = iso(addDays(today(), INTERVALS[st.b])); }
    else { st.b = 0; st.due = iso(addDays(today(), 1)); if (fc.queue.length > 3) fc.queue.splice(3, 0, c); else fc.queue.push(c); }
    S.cards[c.id] = st; save(); fc.shown = false; render(); return;
  }
  if ("rev" in ds){ S.reverse = !S.reverse; save(); fc.shown = false; render(); return; }
  if ("addcard" in ds){
    const en = document.getElementById("nc-en").value.trim(), it = document.getElementById("nc-it").value.trim(), ex = document.getElementById("nc-ex").value.trim();
    if (!en || !it){ toast("Scrivi sia l'inglese sia l'italiano"); return; }
    S.custom.push({id: Date.now().toString(36), en, it, ex}); save(); fc.queue = null; render(); toast("Carta aggiunta"); return;
  }
  if (ds.delcard){ S.custom = S.custom.filter(c => c.id !== ds.delcard); delete S.cards["c"+ds.delcard]; save(); fc.queue = null; render(); return; }
  if (ds.checkEx){
    const [u,i] = ds.checkEx.split("-").map(Number), inp = document.getElementById(`g${u}-${i}`), fb = document.getElementById(`fb${u}-${i}`);
    const ans = GRAMMAR[u].q[i][1].split("|"), ok = ans.some(a => norm(a) === norm(inp.value));
    fb.className = "fb " + (ok ? "good" : "bad");
    fb.innerHTML = ok ? "Corretto." : (inp.value.trim() ? "Non coincide. Soluzione: " : "Soluzione: ") + `<i>${esc(ans[0])}</i>`;
    return;
  }
  if ("copy" in ds){ const t = document.getElementById("draft"); const done = () => toast("Testo copiato"); try { navigator.clipboard.writeText(t.value).then(done, () => { t.select(); toast("Seleziona e copia manualmente"); }); } catch(err){ t.select(); } return; }
  if ("addtest" in ds){
    const g = id => document.getElementById(id).value.trim();
    S.tests.push({id: Date.now().toString(36), date:g("ts-date"), type:g("ts-type"), r:g("ts-r"), l:g("ts-l"), w:g("ts-w"), s:g("ts-s"), n:g("ts-n")}); save(); render(); toast("Risultato salvato"); return;
  }
  if (ds.deltest){ S.tests = S.tests.filter(t => t.id !== ds.deltest); save(); render(); return; }
  if ("setstart" in ds){ const v = document.getElementById("startd").value; if (v){ S.start = v; save(); viewDay = curDay(); render(); toast("Data di inizio salvata"); } return; }
  if ("export" in ds){ const t = document.getElementById("bk"); t.value = btoa(unescape(encodeURIComponent(JSON.stringify(S)))); t.select(); try { navigator.clipboard.writeText(t.value).then(() => toast("Backup copiato"), () => toast("Copia il codice selezionato")); } catch(err){} return; }
  if ("import" in ds){
    try { const o = JSON.parse(decodeURIComponent(escape(atob(document.getElementById("bk").value.trim())))); if (!o || typeof o !== "object" || !("done" in o)) throw 0; S = Object.assign({start:null, done:{}, cards:{}, custom:[], drafts:{}, tests:[], errors:"", reverse:false}, o); save(); viewDay = curDay(); render(); toast("Progressi ripristinati"); }
    catch(err){ toast("Codice non valido: incolla il backup completo"); }
    return;
  }
  if (ds.reset){
    if (ds.reset === "ask") confirmReset = true;
    else if (ds.reset === "yes"){ S = {start:S.start, done:{}, cards:{}, custom:[], drafts:{}, tests:[], errors:"", reverse:false}; save(); confirmReset = false; toast("Progressi cancellati"); }
    else confirmReset = false;
    render(); return;
  }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.check){ if (t.checked) S.done[t.dataset.check] = 1; else delete S.done[t.dataset.check]; save(); render(); }
  if (t.id === "vsel"){ param = t.value; render(); }
  if (t.id === "wsel"){ param = t.value; render(); }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "draft"){ S.drafts[t.dataset.key] = t.value; if (!t.value.trim()) delete S.drafts[t.dataset.key]; save(); document.getElementById("wc").textContent = words(t.value) + " parole"; }
  if (t.id === "errors"){ S.errors = t.value; save(); }
});
render();
if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(() => {});
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e) {}
</script>

</body>
